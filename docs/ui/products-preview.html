<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produtos · proposta Glina</title>
<link rel="stylesheet" href="../../src/maud/web/static/web/vendor/tabler-icons.min.css">
<link rel="stylesheet" href="../../src/maud/web/static/web/app.css">
<style>
/* Somente protótipo. O que for aprovado vira componente do app.css (nada de CSS solto na tela). */
.prototype { padding: 10px 0 0; color: var(--faint); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; }
.head { display: flex; align-items: flex-end; gap: 18px; flex-wrap: wrap; }
.head h1 { margin-bottom: 10px; }
.head .actions { margin-left: auto; display: flex; gap: 10px; padding-bottom: 14px; flex-wrap: wrap; }
.tag { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 12.5px; font-weight: 400; white-space: nowrap; }
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.tag.active::before { background: var(--ok); } .tag.draft::before { background: var(--warn); }
.tag.expired::before { background: var(--err); } .tag.closed::before, .tag.inactive::before { background: var(--muted); }
.tag.plain::before { display: none; }
.tabs { display: flex; gap: 10px; margin: 30px 0 4px; flex-wrap: wrap; }
.tabs a { display: inline-flex; align-items: center; gap: 10px; height: 42px; padding: 0 20px 0 6px; border-radius: 99px; border: 1px solid var(--line-2); color: var(--muted); font-size: 14.5px; text-decoration: none; }
.tabs a small { font-size: 11px; color: var(--faint); width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; }
.tabs a.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 500; }
.tabs a.on small { background: color-mix(in srgb, #031011 14%, transparent); color: var(--on-brand); }
.tabs a.done { color: var(--text); } .tabs a.done small { color: var(--brand); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin: 34px 0 6px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stat { padding: 22px 24px 22px 0; }
.stat + .stat { border-left: 1px solid var(--line); padding-left: 24px; }
.stat .kicker { display: block; margin-bottom: 8px; }
.stat b { display: block; font-size: 30px; font-weight: 300; letter-spacing: -.02em; line-height: 1.1; }
.stat span { font-size: 13px; color: var(--muted); }
.stat span.up { color: var(--brand); }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 10px 12px; font-size: 14px; margin: 0; padding-bottom: 22px; border-bottom: 1px solid var(--line); }
.kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-weight: 400; }
.kv.wide { grid-template-columns: 220px 1fr; border-bottom: 0; padding: 0; }
.kv.wide dd { text-align: left; }
.checks { list-style: none; padding: 18px 0 0; margin: 0; display: flex; flex-direction: column; gap: 10px; font-size: 13.5px; }
.checks li { display: flex; gap: 10px; color: var(--muted); align-items: flex-start; } .checks i { font-size: 17px; line-height: 1.3; }
.checks .ok i { color: var(--ok); } .checks .err i { color: var(--err); } .checks .err { color: var(--text); }
.changed { color: var(--brand); font-size: 12.5px; margin-top: 6px; }
.changed s { color: var(--faint); }
.limits { width: 100%; border-collapse: collapse; table-layout: fixed; }
.limits th:nth-child(1) { width: 25%; } .limits th:nth-child(3), .limits th:nth-child(4) { width: 17%; } .limits th:nth-child(5) { width: 44px; }
.limits .suffix .in { padding: 0 28px 0 12px; } .limits .suffix em { right: 12px; }
.limits th { font-size: 12px; color: var(--muted); font-weight: 400; text-align: left; padding: 0 10px 10px 0; }
.limits td { padding: 6px 10px 6px 0; vertical-align: top; }
.limits td:last-child { width: 40px; padding-right: 0; }
.limits .in { min-width: 0; }
.add { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 99px; border: 1px dashed var(--line-2); color: var(--brand); font-size: 14px; margin-top: 12px; background: none; font-family: inherit; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 14px; border-radius: 99px; border: 1px solid var(--line-2); font-size: 14px; color: var(--muted); cursor: pointer; }
.chip.on { border-color: var(--brand); color: var(--text); box-shadow: inset 0 0 0 1px var(--brand); font-weight: 400; }
.chip.on i { color: var(--brand); }
.risk { display: flex; gap: 8px; }
.risk span { width: 46px; height: 46px; border-radius: 10px; border: 1px solid var(--line-2); display: grid; place-items: center; font-weight: 400; color: var(--muted); cursor: pointer; }
.risk span.on { background: var(--brand); border-color: var(--brand); color: var(--on-brand); font-weight: 600; }
.suffix { position: relative; } .suffix .in { padding-right: 64px; }
.suffix em { position: absolute; right: 14px; top: 0; height: 46px; display: flex; align-items: center; font-style: normal; color: var(--faint); font-size: 13px; }
.prefix { display: flex; align-items: center; gap: 10px; }
.prefix > span { color: var(--faint); font-size: 13px; white-space: nowrap; }
.versions { list-style: none; margin: 0; padding: 0; }
.versions li { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: baseline; padding: 16px 0; border-top: 1px solid var(--line); }
.versions li:last-child { border-bottom: 1px solid var(--line); }
.versions b { font-weight: 500; font-size: 17px; } .versions span { color: var(--muted); font-size: 13.5px; }
.timeline { list-style: none; margin: 26px 0 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 130px 1fr; gap: 26px; padding: 20px 0; border-top: 1px solid var(--line); }
.timeline time { color: var(--muted); font-size: 13px; line-height: 1.5; }
.timeline time b { display: block; color: var(--text); font-weight: 400; font-size: 14px; }
.timeline .what { font-weight: 400; }
.timeline .what small { color: var(--faint); font-size: 11px; letter-spacing: .2em; text-transform: uppercase; margin-right: 10px; }
.diff { margin: 8px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--muted); }
.diff li { display: block; padding: 2px 0; border: 0; }
.diff s { color: var(--faint); } .diff b { color: var(--text); font-weight: 400; }
.reason { margin-top: 8px; border-left: 2px solid var(--line-2); padding-left: 12px; font-size: 13.5px; color: var(--text); }
.file { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; font-weight: 400; }
.file i.ti-file-type-pdf { font-size: 22px; color: var(--muted); }
.file .meta { color: var(--faint); font-weight: 300; font-size: 13px; display: block; }
.file .grow { flex: 1; } .file.archived { opacity: .55; }
.danger { border-left: 2px solid var(--err); padding: 4px 0 4px 16px; margin-top: 10px; }
.danger b { display: block; font-weight: 500; margin-bottom: 4px; }
.danger p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.btn.danger-btn { border-color: var(--err); color: var(--err); }
.btn.small { height: 38px; padding: 0 16px; font-size: 14px; }
.registration-table td small { display: block; color: var(--muted); font-weight: 300; font-size: 13px; }
.registration-table a.link { white-space: nowrap; }
.empty { color: var(--faint); }
dialog { background: var(--bg); color: var(--text); border: 1px solid var(--line-2); border-radius: 14px; padding: 28px 30px; max-width: 520px; width: calc(100% - 40px); }
dialog::backdrop { background: rgba(0, 0, 0, .55); }
dialog h2 { margin: 0 0 8px; font-size: 22px; font-weight: 500; letter-spacing: -.01em; }
dialog p { color: var(--muted); margin: 0 0 18px; }
dialog .actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 22px; }
@media (max-width: 1200px) { .body { grid-template-columns: minmax(0, 1fr); } .aside { position: static; padding-top: 0; } .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stat:nth-child(3) { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); } .stat:nth-child(4) { border-top: 1px solid var(--line); } .stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } .stats.three .stat:nth-child(3) { border-left: 1px solid var(--line); padding-left: 24px; border-top: 0; } }
@media (max-width: 760px) { .sec, .grid { grid-template-columns: minmax(0, 1fr); gap: 18px; } .bar { margin-left: -20px; margin-right: -20px; padding: 16px 20px; flex-wrap: wrap; } .timeline li { grid-template-columns: 1fr; gap: 6px; } .kv.wide { grid-template-columns: 1fr; } .head .actions { margin-left: 0; } .stats, .stats.three { grid-template-columns: 1fr; } .stat + .stat, .stats.three .stat:nth-child(3) { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); } .limits thead { display: none; } .limits tr { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); } .limits td { padding: 0; } .limits td:first-child, .limits td:nth-child(2) { grid-column: 1 / -1; } .who { display: none; } }
</style></head>
<body>
<div class="app">
<aside class="side">
  <a class="wordmark" href="?view=list"><span class="mark">GD</span><b>Gestão de apólices</b></a>
  <details class="nav-group"><summary class="kicker">Carteira<span class="nav-chevron"></span></summary><nav class="nav"><a href="#">Painel</a></nav></details>
  <details class="nav-group" open><summary class="kicker">Produtos<span class="nav-chevron"></span></summary><nav class="nav"><a class="on" href="?view=list">Cadastro de produtos</a></nav></details>
  <details class="nav-group"><summary class="kicker">Pessoas e entidades<span class="nav-chevron"></span></summary><nav class="nav"><a href="#">Pessoas físicas e jurídicas</a></nav></details>
  <details class="nav-group"><summary class="kicker">Ativos<span class="nav-chevron"></span></summary><nav class="nav"><a href="#">Cadastro de ativos</a></nav></details>
  <details class="nav-group"><summary class="kicker">Negociação<span class="nav-chevron"></span></summary><nav class="nav"><a href="#">Casas de negociação</a></nav></details>
  <details class="nav-group"><summary class="kicker">Administração<span class="nav-chevron"></span></summary><nav class="nav"><a href="#">Personalização</a></nav></details>
</aside>
<main class="main">
  <div class="top">
    <div class="crumb" id="crumb"></div><div class="grow"></div>
    <button class="icon-btn" type="button" id="theme" title="Trocar o tema" aria-label="Trocar o tema"><i class="ti ti-contrast-2"></i></button>
    <div class="who"><i class="av">AD</i>admin</div>
  </div>
  <div class="prototype">Proposta visual · dados ilustrativos · nada é gravado</div>
  <div id="content"></div>
</main>
</div>
<dialog id="confirm"></dialog>
<script>
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'list';
const tab = params.get('tab') || 'overview';
document.documentElement.dataset.theme = params.get('theme') || 'dark';
document.getElementById('theme').onclick = () => {
  const root = document.documentElement; root.dataset.theme = root.dataset.theme === 'dark' ? 'light' : 'dark';
};

const STATUS = { DRAFT: ['draft', 'Rascunho'], ACTIVE: ['active', 'Ativo'], INACTIVE: ['inactive', 'Inativo'], EXPIRED: ['expired', 'Expirado'], CLOSED: ['closed', 'Encerrado'] };
const tag = s => `<span class="tag ${STATUS[s][0]}">${STATUS[s][1]}</span>`;
const PRODUCTS = [
  { code: 'GLINA-USD-01', name: 'Glina Conservador USD', currency: 'USD', status: 'ACTIVE', mandate: 'v1 · risco 2', next: 'v2 a partir de 27/12/2026', policy: 'AP-2026-001', policyNote: 'vigente até 26/11/2031' },
  { code: 'GLINA-USD-02', name: 'Glina Moderado USD', currency: 'USD', status: 'DRAFT', mandate: 'v1 em rascunho', next: 'faltam 9 campos para publicar', policy: '—', policyNote: 'sem apólice' },
  { code: 'GLINA-EUR-01', name: 'Glina Euro 2026', currency: 'EUR', status: 'EXPIRED', mandate: 'v1 · risco 1', next: '', policy: 'NB-7781', policyNote: 'expirada em 27/11/2026' },
];

const field = (label, value = '', opts = {}) => {
  const req = opts.req ? ' <em>*</em>' : '';
  const cls = 'f' + (opts.full ? ' full' : '') + (opts.bad ? ' bad' : '');
  let input;
  if (opts.options) input = `<select class="in"${opts.disabled ? ' disabled' : ''}>${opts.options.map(o => `<option${o === value ? ' selected' : ''}>${o}</option>`).join('')}</select>`;
  else if (opts.area) input = `<textarea class="in" rows="3" style="height:auto;padding-top:12px" placeholder="${opts.ph || ''}">${value}</textarea>`;
  else if (opts.suffix) input = `<div class="suffix"><input class="in" value="${value}" placeholder="${opts.ph || ''}"><em>${opts.suffix}</em></div>`;
  else if (opts.prefix) input = `<div class="prefix"><span>${opts.prefix}</span><input class="in" value="${value}" placeholder="${opts.ph || ''}"></div>`;
  else input = `<input class="in" type="${opts.type || 'text'}" value="${value}" placeholder="${opts.ph || ''}"${opts.disabled ? ' disabled' : ''}>`;
  const msg = opts.msg ? `<div class="msg${opts.bad ? ' err' : ''}">${opts.msg}</div>` : '';
  const changed = opts.was !== undefined ? `<div class="changed">Na v1: <s>${opts.was}</s></div>` : '';
  return `<div class="${cls}"><label>${label}${req}</label>${input}${msg}${changed}</div>`;
};
const section = (title, hint, inner, grid = true) => `<section class="sec"><div><h2>${title}</h2><p class="hint">${hint}</p></div>${grid ? `<div class="grid">${inner}</div>` : `<div>${inner}</div>`}</section>`;
const bar = (note, buttons) => `<div class="bar"><span class="note">${note}</span><div class="grow"></div>${buttons}</div>`;

let crumb = '', html = '';

if (view === 'list') {
  crumb = 'Produtos / <span>Cadastro de produtos</span>';
  html = `<h1>Seus <mark>produtos.</mark></h1>
  <p class="lead">Cada produto tem um regulamento com versões e uma apólice. Abra o produto para ver, editar e acompanhar o histórico.</p>
  <div class="registration-toolbar">
    <div class="f"><label>Buscar por código ou nome</label><input class="in" placeholder="Digite para buscar"></div>
    <div class="f"><label>Status</label><select class="in"><option>Todos</option><option>Rascunho</option><option>Ativo</option><option>Inativo</option><option>Expirado</option><option>Encerrado</option></select></div>
    <button class="btn">Filtrar</button>
    <a class="btn primary" href="?view=new">Novo produto</a>
  </div>
  <div class="registration-table-wrap"><table class="registration-table"><thead><tr><th>Produto</th><th>Moeda</th><th>Status</th><th>Regulamento</th><th>Apólice</th><th>Ação</th></tr></thead><tbody>
  ${PRODUCTS.map(p => `<tr><td>${p.name}<small>${p.code}</small></td><td>${p.currency}</td><td>${tag(p.status)}</td><td>${p.mandate}<small>${p.next || '&nbsp;'}</small></td><td>${p.policy}<small>${p.policyNote}</small></td><td><a class="link" href="?view=detail${p.status === 'DRAFT' ? '&product=draft' : p.status === 'EXPIRED' ? '&product=expired' : ''}">Abrir produto →</a></td></tr>`).join('')}
  </tbody></table></div>
  <p class="msg">3 registros · Página 1 de 1</p>`;
}

else if (view === 'new') {
  crumb = '<a href="?view=list">Produtos</a> / <span>Novo produto</span>';
  html = `<form class="registration-form"><h1>Novo <mark>produto.</mark></h1>
  <p class="lead">O produto nasce em rascunho. Depois de salvo, você cadastra a apólice e o regulamento e então ativa.</p>
  <div class="body"><div>
  ${section('Identificação', 'Código e moeda não mudam depois que o produto sai do rascunho.',
    field('Código', 'GLINA-USD-03', { req: true, msg: 'Letras, números e hífen. Único no app.' }) +
    field('Nome', 'Glina Arrojado USD', { req: true }) +
    field('Moeda base', 'USD · US Dollar', { req: true, options: ['USD · US Dollar', 'EUR · Euro'], msg: 'Padrão USD. A apólice segue esta moeda.' }) +
    field('Descrição', 'Carteira com mais renda variável, horizonte de 5 anos.', { full: true, area: true }))}
  ${section('Datas', 'Opcionais. O encerramento não pode ser antes do lançamento.',
    field('Lançamento', '2027-01-04', { type: 'date' }) +
    field('Encerramento', '2026-12-01', { type: 'date', bad: true, msg: 'O encerramento tem de ser depois do lançamento.' }))}
  </div>
  <aside class="aside"><div class="quote"><b>Glina Arrojado USD</b><span>GLINA-USD-03 · USD · Rascunho</span></div>
  <div class="kicker">Para ativar depois</div>
  <ul class="checks">
    <li><i class="ti ti-circle-dashed"></i>Apólice cadastrada e vigente</li>
    <li><i class="ti ti-circle-dashed"></i>Regulamento publicado e em vigor</li>
  </ul></aside></div>
  ${bar('Produto novo, em rascunho', '<a class="btn" href="?view=list">Voltar à lista</a><a class="btn" href="?view=list">Cancelar</a><a class="btn primary" href="?view=detail&product=draft">Salvar produto</a>')}
  </form>`;
}

else if (view === 'detail') {
  const kind = params.get('product') || 'active';
  const p = kind === 'draft' ? PRODUCTS[1] : kind === 'expired' ? PRODUCTS[2] : PRODUCTS[0];
  const base = `?view=detail${kind === 'active' ? '' : '&product=' + kind}`;
  const tabs = [['overview', 'Visão geral'], ['mandate', 'Regulamento'], ['policy', 'Apólice'], ['documents', 'Documentos'], ['history', 'Histórico']];
  crumb = `<a href="?view=list">Produtos</a> / <span>${p.code}</span>`;
  const actions = {
    active: '<a class="btn small" href="?view=edit">Editar</a><button class="btn small" data-confirm="inactive">Inativar</button><button class="btn small" data-confirm="close">Encerrar</button>',
    draft: '<a class="btn small" href="?view=edit">Editar</a><button class="btn small" data-confirm="close">Encerrar</button><button class="btn small primary" data-confirm="activate-blocked">Ativar</button>',
    expired: '<button class="btn small" data-confirm="close">Encerrar</button>',
  }[kind];
  html = `<div class="head"><h1>${p.name.replace(/(\w+)$/, '<mark>$1.</mark>')}</h1><div class="actions">${actions}</div></div>
  <p class="lead">${tag(p.status)} &nbsp; ${p.code} · moeda base ${p.currency}${kind === 'expired' ? ' · expirou junto com a apólice NB-7781; agora só pode ser encerrado' : ''}</p>
  <nav class="tabs">${tabs.map(([k, l], i) => `<a class="${k === tab ? 'on' : ''}" href="${base}&tab=${k}"><small>${String(i + 1).padStart(2, '0')}</small>${l}</a>`).join('')}</nav>`;

  if (tab === 'overview') {
    if (kind === 'draft') {
      html += `<div class="stats">
        <div class="stat"><span class="kicker">Status</span><b>Rascunho</b><span>criado em 27/11/2026</span></div>
        <div class="stat"><span class="kicker">Regulamento</span><b>v1</b><span>em rascunho</span></div>
        <div class="stat"><span class="kicker">Apólice</span><b>—</b><span>não cadastrada</span></div>
        <div class="stat"><span class="kicker">Documentos</span><b>0</b><span>nenhum anexo</span></div></div>
      <div class="body"><div>
      ${section('Antes de ativar', 'O produto só fica ativo com as duas condições abaixo.', `<ul class="checks" style="padding-top:0">
        <li class="err"><i class="ti ti-alert-circle"></i><span>Nenhuma apólice cadastrada. <a class="link" href="?view=policy">Cadastrar apólice →</a></span></li>
        <li class="err"><i class="ti ti-alert-circle"></i><span>Regulamento v1 ainda em rascunho, faltam 9 campos. <a class="link" href="?view=mandate">Continuar regulamento →</a></span></li></ul>`, false)}
      ${section('Identificação', 'Enquanto rascunho, código e moeda ainda podem mudar.', `<dl class="kv wide"><dt>Código</dt><dd>GLINA-USD-02</dd><dt>Nome</dt><dd>Glina Moderado USD</dd><dt>Moeda base</dt><dd>USD</dd><dt>Descrição</dt><dd>Em montagem.</dd></dl>`, false)}
      </div><aside class="aside"><div class="quote"><b>Rascunho</b><span>Ninguém compra este produto enquanto ele não for ativado.</span></div></aside></div>`;
    } else {
      const expired = kind === 'expired';
      html += `<div class="stats three">
        <div class="stat"><span class="kicker">Status</span><b>${expired ? 'Expirado' : 'Ativo'}</b><span>desde 27/11/2026</span></div>
        <div class="stat"><span class="kicker">Regulamento vigente</span><b>v1</b><span>em vigor desde 27/11/2026</span></div>
        <div class="stat"><span class="kicker">Apólice</span><b>${expired ? 'NB-7781' : 'AP-2026-001'}</b><span>${expired ? 'expirada em 27/11/2026' : 'vigente até 26/11/2031'}</span></div></div>
      <div class="body"><div>
      ${section('Perfil', 'Do regulamento vigente. A v2 muda o que está marcado.', `<dl class="kv wide">
        <dt>Nível de risco</dt><dd>2 de 5</dd>
        <dt>Retorno-alvo</dt><dd>SOFR + 2,00% a.a.${expired ? '' : ' <span class="changed">→ SOFR + 2,50% na v2</span>'}</dd>
        <dt>Liquidez</dt><dd>30 dias</dd>
        <dt>Prazo médio máximo</dt><dd>3,5 anos</dd>
        <dt>Classes elegíveis</dt><dd>Renda variável, Renda fixa</dd>
        <dt>Renda variável</dt><dd>0% a 20%${expired ? '' : ' <span class="changed">→ até 30% na v2</span>'}</dd>
        <dt>Renda fixa</dt><dd>60% a 100%</dd>
        <dt>Em USD</dt><dd>80% a 100%</dd></dl>`, false)}
      ${section('Entrada e saída', 'Sem taxas de entrada ou saída.', `<dl class="kv wide">
        <dt>Aplicação inicial mínima</dt><dd>USD 10.000,00</dd><dt>Aplicação adicional mínima</dt><dd>USD 1.000,00</dd>
        <dt>Liquidação da aplicação</dt><dd>D+2</dd><dt>Resgate mínimo</dt><dd>USD 1.000,00</dd>
        <dt>Saldo mínimo</dt><dd>USD 5.000,00</dd><dt>Aviso de resgate</dt><dd>5 dias</dd>
        <dt>Liquidação do resgate</dt><dd>D+5</dd><dt>Carência</dt><dd>12 meses</dd></dl>`, false)}

  inactive: ['Inativar o produto?', 'O produto para de aceitar novas aplicações até ser ativado de novo.', 'Inativar'],
  archive: ['Arquivar o documento?', 'O arquivo continua guardado e aparece no histórico, mas sai da lista de documentos em uso.', 'Arquivar'],

const dialog = document.getElementById('confirm');
document.querySelectorAll('[data-confirm]').forEach(b => b.onclick = e => {
  e.preventDefault();
  const [title, text, ok, danger] = DIALOGS[b.dataset.confirm];
  const askReason = ok && b.dataset.confirm !== 'publish';
  dialog.innerHTML = `<h2>${title}</h2><p>${text}</p>${askReason ? `<div class="f"><label>Motivo (opcional, fica no histórico)</label><textarea class="in" rows="2" style="height:auto;padding-top:10px"></textarea></div>` : ''}

  dialog.querySelectorAll('button').forEach(x => x.onclick = () => dialog.close());
  dialog.showModal();
});
