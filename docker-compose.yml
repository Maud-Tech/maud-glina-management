# Ambiente local. Valores abaixo são SÓ de desenvolvimento.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: maud
      POSTGRES_PASSWORD: maud
      POSTGRES_DB: ${POSTGRES_DB:-maud_glina_management}
    ports:
      - "${POSTGRES_PORT:-5435}:5432" # porta do .env; cada repositório da arquitetura Glina usa uma
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maud -d $${POSTGRES_DB:-maud_glina_management}"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build: .
    command: sh -c "python manage.py migrate --noinput && gunicorn maud.config.wsgi -b 0.0.0.0:8000 -w 3"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8002:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python manage.py worker
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
