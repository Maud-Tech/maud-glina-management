<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="760" viewBox="0 0 1700 760" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#222">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
</defs>
<rect width="1700" height="760" fill="#fff"/>
<rect x="730" y="20" width="260" height="40" fill="#cfe2f3" stroke="#555"/>
<text x="860" y="46" text-anchor="middle" font-size="18" font-weight="bold">Arquitetura Glina</text>

<!-- Glina -->
<rect x="60" y="180" width="200" height="540" fill="#cfe2f3" stroke="#555"/>
<text x="160" y="470" text-anchor="middle" font-size="17" font-weight="bold"><tspan x="160" dy="0">Sistema</tspan><tspan x="160" dy="22">da Glina</tspan></text>
<text x="160" y="525" text-anchor="middle" font-size="13"><tspan x="160" dy="0">portal do cliente:</tspan><tspan x="160" dy="18">cadastro, telas,</tspan><tspan x="160" dy="18">pagamento.</tspan><tspan x="160" dy="26">Fala só com a API</tspan><tspan x="160" dy="18">na AWS. Nunca</tspan><tspan x="160" dy="18">enxerga a rede</tspan><tspan x="160" dy="18">da Maud.</tspan></text>

<!-- AWS -->
<rect x="330" y="130" width="300" height="590" fill="#ededed" stroke="#555"/>
<text x="610" y="158" text-anchor="end" font-size="17" font-weight="bold">AWS · conta da Maud</text>
<rect x="365" y="390" width="230" height="160" fill="#cfe2f3" stroke="#555"/>
<text x="480" y="420" text-anchor="middle" font-size="16" font-weight="bold">API (porteiro)</text>
<text x="480" y="446" text-anchor="middle"><tspan x="480" dy="0">confere a chave da Glina,</tspan><tspan x="480" dy="19">limita chamadas, garante</tspan><tspan x="480" dy="19">idempotência, registra log,</tspan><tspan x="480" dy="19">repassa pela VPN.</tspan><tspan x="480" dy="22" font-weight="bold">Sem banco, sem regra.</tspan></text>


<!-- Maud -->
<rect x="700" y="130" width="960" height="590" fill="#ffffcc" stroke="#555"/>
<text x="1640" y="158" text-anchor="end" font-size="17" font-weight="bold">Maud · dentro de casa</text>

<!-- App de passivo -->
<rect x="725" y="180" width="450" height="510" fill="#f6fbfd" stroke="#0b3c4f" stroke-width="1.5"/>
<text x="950" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#0b3c4f">App de passivo</text>
<text x="950" y="226" text-anchor="middle" font-size="13" fill="#0b3c4f">sabe de quem é cada pedaço · é com ele que a Glina fala</text>

<rect x="755" y="245" width="240" height="90" fill="#cfe2f3" stroke="#555"/>
<text x="875" y="270" text-anchor="middle" font-size="15" font-weight="bold">API</text>
<text x="875" y="291" text-anchor="middle" font-size="13"><tspan x="875" dy="0">abrir conta, reservar, confirmar,</tspan><tspan x="875" dy="17">vender, saldo, posição, preço do dia</tspan></text>

<rect x="755" y="395" width="240" height="100" fill="#cfe2f3" stroke="#555"/>
<text x="875" y="418" text-anchor="middle" font-size="15" font-weight="bold">Backend</text>
<text x="875" y="439" text-anchor="middle" font-size="13"><tspan x="875" dy="0">um dono por pedaço;</tspan><tspan x="875" dy="17">só vende até o total conferido</tspan><tspan x="875" dy="17">pela gestão; grava a versão usada</tspan></text>

<rect x="755" y="555" width="240" height="100" fill="#cfe2f3" stroke="#555"/>
<text x="875" y="578" text-anchor="middle" font-size="15" font-weight="bold">Worker</text>
<text x="875" y="599" text-anchor="middle" font-size="13"><tspan x="875" dy="0">expira reservas, lê a gestão,</tspan><tspan x="875" dy="17">conferência diária, congela a</tspan><tspan x="875" dy="17">apólice se o total conferido cair</tspan></text>

<line x1="875" y1="337" x2="875" y2="393" stroke="#222" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="875" y1="497" x2="875" y2="553" stroke="#222" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

<!-- cilindro passivo -->
<path d="M1018 430 v180 a70 14 0 0 0 140 0 v-180" fill="#cfe2f3" stroke="#555"/>
<ellipse cx="1088" cy="430" rx="70" ry="14" fill="#dfeef8" stroke="#555"/>
<text x="1088" y="470" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic">PostgreSQL</text>
<text x="1088" y="492" text-anchor="middle" font-size="13" font-style="italic"><tspan x="1088" dy="0">clientes, apólices,</tspan><tspan x="1088" dy="17">pedaços e estado,</tspan><tspan x="1088" dy="17">reservas, negócios,</tspan><tspan x="1088" dy="17">ajustes, cópia dos</tspan><tspan x="1088" dy="17">fechamentos lidos</tspan></text>
<line x1="997" y1="470" x2="1016" y2="470" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="997" y1="600" x2="1016" y2="600" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>



<!-- App de gestão -->
<rect x="1200" y="180" width="435" height="510" fill="#fffdf5" stroke="#a8864a" stroke-width="1.5"/>
<text x="1417" y="208" text-anchor="middle" font-size="17" font-weight="bold" fill="#6d5425">App de gestão</text>
<text x="1417" y="226" text-anchor="middle" font-size="13" fill="#6d5425">sabe o que existe e quanto vale · não conhece cliente</text>

<rect x="1230" y="245" width="240" height="90" fill="#cfe2f3" stroke="#555"/>
<text x="1350" y="270" text-anchor="middle" font-size="15" font-weight="bold">API (só leitura, interna)</text>
<text x="1350" y="291" text-anchor="middle" font-size="13"><tspan x="1350" dy="0">fechamento por apólice, data e</tspan><tspan x="1350" dy="17">versão; total conferido; pendências</tspan></text>

<rect x="1230" y="395" width="240" height="100" fill="#cfe2f3" stroke="#555"/>
<text x="1350" y="418" text-anchor="middle" font-size="15" font-weight="bold">Backend</text>
<text x="1350" y="439" text-anchor="middle" font-size="13"><tspan x="1350" dy="0">apólices, contas correntes, ativos;</tspan><tspan x="1350" dy="17">PL por data; oficializa e retifica</tspan><tspan x="1350" dy="17">sem editar versão publicada</tspan></text>

<rect x="1230" y="555" width="240" height="100" fill="#cfe2f3" stroke="#555"/>
<text x="1350" y="578" text-anchor="middle" font-size="15" font-weight="bold">Worker</text>
<text x="1350" y="599" text-anchor="middle" font-size="13"><tspan x="1350" dy="0">ingere extratos, posições e preços;</tspan><tspan x="1350" dy="17">confere com a custódia;</tspan><tspan x="1350" dy="17">reprocessa gerando versão nova</tspan></text>

<line x1="1350" y1="337" x2="1350" y2="393" stroke="#222" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<line x1="1350" y1="497" x2="1350" y2="553" stroke="#222" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>

<!-- cilindro gestão -->
<path d="M1486 430 v180 a70 14 0 0 0 140 0 v-180" fill="#cfe2f3" stroke="#555"/>
<ellipse cx="1556" cy="430" rx="70" ry="14" fill="#dfeef8" stroke="#555"/>
<text x="1556" y="470" text-anchor="middle" font-size="14" font-weight="bold" font-style="italic">PostgreSQL</text>
<text x="1556" y="492" text-anchor="middle" font-size="13" font-style="italic"><tspan x="1556" dy="0">apólices, contas,</tspan><tspan x="1556" dy="17">movimentos, posições,</tspan><tspan x="1556" dy="17">preços, fechamentos</tspan><tspan x="1556" dy="17">(todas as versões),</tspan><tspan x="1556" dy="17">pendências</tspan></text>
<line x1="1472" y1="470" x2="1484" y2="470" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1472" y1="600" x2="1484" y2="600" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>



<!-- ligação única passivo -> gestão -->
<path d="M997 400 L1070 400 L1070 290 L1228 290" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="1148" y="280" text-anchor="middle" font-size="13" font-style="italic">lê (sentido único)</text>

<!-- fluxo de fora para dentro -->
<line x1="262" y1="470" x2="363" y2="470" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="312" y="460" text-anchor="middle" font-size="13">https + chave</text>
<path d="M597 470 L665 470 L665 300 L753 300" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="650" y="385" text-anchor="middle" font-size="13" font-weight="bold" transform="rotate(-90 650 385)">VPN, aberta de dentro</text>

<!-- resposta -->
<path d="M755 275 L740 275 L740 95 L160 95 L160 178" fill="none" stroke="#222" stroke-width="1.5" marker-end="url(#a)"/>
<text x="450" y="86" text-anchor="middle" font-size="14">resposta (pelo mesmo caminho)</text>

</svg>
