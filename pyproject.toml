[project]
name = "maud-glina-management"
version = "0.1.0"
description = "App de gestão da arquitetura Glina: sabe o que existe e quanto vale. Não conhece cliente."
requires-python = ">=3.12"
dependencies = [
    "django>=5.1,<5.3",
    "django-ninja>=1.3,<2",
    "psycopg[binary]>=3.2,<4",
    "gunicorn>=23,<24",
    "whitenoise>=6.11,<7",
    "pillow>=11,<13",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "django-stubs[compatible-mypy]>=5.1",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "hypothesis>=6.120",
    "import-linter>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maud"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
cache-dir = ".cache/ruff"
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "DJ", "N", "PLC2401", "PLC2403"]  # PLC24xx: nome com acento (ADR 0003)
ignore = ["RUF001", "RUF002", "RUF003"] # acentos em português são intencionais

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "RUF012"]
"**/models.py" = ["RUF012"] # class Meta do Django usa listas por convenção

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
cache_dir = ".cache/mypy"
plugins = ["mypy_django_plugin.main"]
mypy_path = "src"
packages = ["maud"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
exclude = ["/migrations/"]

[tool.django-stubs]
django_settings_module = "maud.config.settings"

# Regras puras e o kernel numérico: tipagem estrita.
[[tool.mypy.overrides]]
module = ["maud.*.domain.*", "maud.modules.*.domain.*", "maud.shared.money", "maud.shared.shares", "maud.shared.clock", "maud.shared.errors"]
strict = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "maud.config.settings"
testpaths = ["src", "tests"]
python_files = ["test_*.py"]
# --no-migrations: as tabelas de teste saem direto dos models (migration não vai para o git).
addopts = "-ra --strict-markers --import-mode=importlib --no-migrations"
cache_dir = ".cache/pytest"

# ---------------------------------------------------------------- import-linter
# Fronteiras verificadas no CI. Ver docs/adr/0001-modular-monolith.md.
[tool.importlinter]
root_packages = ["maud"]
include_external_packages = true

# Ao criar um módulo (skill `new-module`): inclua-o nas camadas, na lista do domain/ puro
# e ganhe um contrato "Internas de <módulo> são privadas" (copie o do example).
[[tool.importlinter.contracts]]
name = "Camadas: um módulo só importa os módulos abaixo dele"
type = "layers"
layers = [
    "maud.config",
    "maud.web",
    "maud.jobs",
    "maud.integration",
    "maud.modules.example",
    "maud.modules.assets",
    "maud.modules.entities",
    "maud.modules.branding",
    "maud.shared",
]

[[tool.importlinter.contracts]]
name = "domain/ é puro: não importa Django nem Ninja"
type = "forbidden"
source_modules = [
    "maud.modules.example.domain",
    "maud.modules.assets.domain",
    "maud.modules.entities.domain",
    "maud.modules.branding.domain",
]
forbidden_modules = ["django", "ninja", "psycopg"]

# Partes internas de um módulo só são importadas pelo próprio módulo.
# Superfície pública de cada módulo: api.py (outros módulos), routes.py (config), jobs.py (jobs).
[[tool.importlinter.contracts]]
name = "Internas de example são privadas"
type = "forbidden"
source_modules = ["maud.config", "maud.web", "maud.jobs", "maud.integration", "maud.modules.assets", "maud.modules.entities", "maud.modules.branding"]
forbidden_modules = ["maud.modules.example.features", "maud.modules.example.domain", "maud.modules.example.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Internas de assets são privadas"
type = "forbidden"
source_modules = ["maud.config", "maud.web", "maud.jobs", "maud.integration", "maud.modules.example", "maud.modules.entities", "maud.modules.branding"]
forbidden_modules = ["maud.modules.assets.features", "maud.modules.assets.domain", "maud.modules.assets.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Internas de entities são privadas"
type = "forbidden"
source_modules = ["maud.config", "maud.web", "maud.jobs", "maud.integration", "maud.modules.example", "maud.modules.assets", "maud.modules.branding"]
forbidden_modules = ["maud.modules.entities.features", "maud.modules.entities.domain", "maud.modules.entities.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Internas de branding são privadas"
type = "forbidden"
source_modules = ["maud.config", "maud.web", "maud.jobs", "maud.integration", "maud.modules.example", "maud.modules.assets", "maud.modules.entities"]
forbidden_modules = ["maud.modules.branding.features", "maud.modules.branding.domain", "maud.modules.branding.models"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Internas de integration são privadas"
type = "forbidden"
source_modules = ["maud.config", "maud.web", "maud.jobs", "maud.modules.example", "maud.modules.assets", "maud.modules.entities", "maud.modules.branding"]
forbidden_modules = ["maud.integration.features", "maud.integration.adapters"]
allow_indirect_imports = true
